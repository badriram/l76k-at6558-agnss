name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: C library tests (strict warnings)
        run: make test
      - name: Python tools parse
        run: python3 -m py_compile tools/fetch_agnss.py
